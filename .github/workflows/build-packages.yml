  release:
    needs: [ build-rpm, build-deb ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare assets
        run: |
          mkdir -p assets
          for f in dist/*/*; do
            d=$(basename "$(dirname "$f")")
            cp "$f" "assets/${d}-$(basename "$f")"
          done
          ls -l assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --generate-notes -R "$GITHUB_REPOSITORY"
